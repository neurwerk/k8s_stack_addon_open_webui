[project]
name = "open-webui-tooling"
version = "0.2.1"
description = "Offline definition validation for the Open WebUI add-on"
requires-python = ">=3.12"
dependencies = ["k8s-stack-tooling==0.15.8"]

[tool.uv.sources]
k8s-stack-tooling = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/v0.15.8/k8s_stack_tooling-0.15.8-py3-none-any.whl"}
openbao-stack-setup = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/stack-setup-v0.8.4/openbao_stack_setup-0.8.4-py3-none-any.whl"}

[project.scripts]
open-webui-validate = "open_webui_tooling.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15.17", "ty>=0.0.49", "openbao-stack-setup==0.8.4"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["open_webui_tooling"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

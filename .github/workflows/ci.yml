name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Source/tooling-image quality uses this reviewed immutable candidate; integration tags require stable Base.
  BASE_REF: d2053342856a82905d5ee3f00879e0547cb22909

jobs:
  validate:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.7"
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.0.0
        with:
          version: v4.2.4
      - name: Install Kustomize
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          name: kustomize
          version: v5.8.1
      - name: Install kubeconform
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          name: kubeconform
          version: v0.8.0
      - name: Read exact Base prerequisite
        id: prerequisite
        run: |
          uv run --locked --project tooling python -c 'from pathlib import Path; from k8s_stack_tooling.addons import load_manifest; print("base=v" + load_manifest(Path("release/manifest.yaml")).spec.prerequisites.base)' >> "$GITHUB_OUTPUT"
      - name: Acquire selected Base release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neurwerk/k8s_stack_base
          ref: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/tooling/v') && steps.prerequisite.outputs.base || env.BASE_REF }}
          path: .ci/base
      - name: Run full validation
        run: make check BASE_REPO="$GITHUB_WORKSPACE/.ci/base"
      - name: Build the tooling image without publication
        run: |
          version="$(uv run --locked --project tooling python -c 'import tomllib; print(tomllib.load(open("tooling/pyproject.toml", "rb"))["project"]["version"])')"
          make tooling-build VERSION="$version" REVISION="$GITHUB_SHA"
      - name: Verify installed CLI and default non-root image user offline
        run: |
          image="$(uv run --locked --project tooling python - <<'PY'
          import tomllib
          with open("tooling/pyproject.toml", "rb") as project:
              version = tomllib.load(project)["project"]["version"]
          print(f"ghcr.io/neurwerk/k8s-stack-addon-open-webui-tooling:{version}")
          PY
          )"
          docker run --rm --network none --read-only "$image" open-webui-validate --help
          docker run --rm --network none --read-only \
            --entrypoint /opt/tooling/.venv/bin/python "$image" -c \
            'import os; assert os.getuid() == 65532; assert os.getgid() == 65532'

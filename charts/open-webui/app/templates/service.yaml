{{- if .Values.frontendOpenWebui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: frontend-open-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "open-webui.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
{{- end }}

{{- if .Values.frontendOpenWebui.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: frontend-open-webui-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: frontend-open-webui-shared
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: frontend-open-webui
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ required "postgresqlPassword is required" .Values.frontendOpenWebuiSecrets.postgresqlPassword | quote }}
  OAUTH_CLIENT_SECRET: {{ required "openidClientSecret is required" .Values.frontendOpenWebuiSecrets.openidClientSecret | quote }}
  WEBUI_SECRET_KEY: {{ required "webuiSecretKey is required" .Values.frontendOpenWebuiSecrets.webuiSecretKey | quote }}
  OAUTH_SESSION_TOKEN_ENCRYPTION_KEY: {{ required "oauthSessionTokenEncryptionKey is required" .Values.frontendOpenWebuiSecrets.oauthSessionTokenEncryptionKey | quote }}
  OAUTH_CLIENT_INFO_ENCRYPTION_KEY: {{ required "oauthClientInfoEncryptionKey is required" .Values.frontendOpenWebuiSecrets.oauthClientInfoEncryptionKey | quote }}
{{- end }}

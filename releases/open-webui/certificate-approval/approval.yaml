apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-open-webui-approval-policy
  namespace: infra-cert-manager
spec:
  interval: 5m
  timeout: 15m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  waitStrategy:
    name: poller
  healthCheckExprs:
    - apiVersion: policy.cert-manager.io/v1alpha1
      kind: CertificateRequestPolicy
      inProgress: "!status.conditions.exists(e, e.type == 'Ready' && e.observedGeneration == metadata.generation && e.status != 'Unknown')"
      failed: status.conditions.exists(e, e.type == 'Ready' && e.observedGeneration == metadata.generation && e.status == 'False')
      current: status.conditions.exists(e, e.type == 'Ready' && e.observedGeneration == metadata.generation && e.status == 'True')
  dependsOn:
    - name: cert-manager-approver-policy
      namespace: infra-cert-manager
  chart:
    spec:
      chart: ./charts/open-webui/certificate-approval
      sourceRef: {kind: GitRepository, name: open-webui-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: client-values}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-open-webui-access
  namespace: auth-keycloak
spec:
  interval: 5m
  timeout: 15m
  dependsOn:
    - name: keycloak-realm-roles
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  chart:
    spec:
      chart: ./charts/keycloak/addon-access
      sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: auth-keycloak-app-defaults}
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: keycloak-product-values}
    - {kind: ConfigMap, name: open-webui-oidc-approval-values}
  values:
    k8sTools:
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.15.6@sha256:2cfe62109c8067e08a81f422733e6673ef3eb0ee11066f72e7316878a76013db
    addonAccess:
      enabled: true
      name: openwebui
      realmRoles: [openwebui-user, openwebui-admin]
      ownedRoles: [openwebui-user, openwebui-admin]
      realmRoleComposites:
        openwebui-admin: [openwebui-user]
      platformAdminRole: openwebui-admin
      accessGroups:
        /access/neurwerk-openwebui-admins:
          realmRoles: [openwebui-admin]
        /access/neurwerk-openwebui-users:
          realmRoles: [openwebui-user]

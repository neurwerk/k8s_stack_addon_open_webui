apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-open-webui-shared
  namespace: frontend-open-webui
spec:
  releaseName: frontend-open-webui-shared
  interval: 5m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  chart:
    spec:
      chart: ./charts/open-webui/shared
      sourceRef: {kind: GitRepository, name: open-webui-addon, namespace: flux-system}
      interval: 10m
  valuesFrom:
    - {kind: ConfigMap, name: frontend-open-webui-app-defaults}
    - {kind: ConfigMap, name: client-openrouter-catalog-values, optional: true}
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: open-webui-agentgateway-model-values}
    - {kind: ConfigMap, name: open-webui-product-values}

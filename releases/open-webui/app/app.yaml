apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-open-webui
  namespace: frontend-open-webui
spec:
  releaseName: frontend-open-webui
  interval: 5m
  timeout: 20m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  dependsOn:
    - {name: frontend-open-webui-shared, namespace: frontend-open-webui}
    - {name: open-webui-postgres, namespace: infra-postgres-operations}
    - {name: keycloak-open-webui-oidc, namespace: auth-keycloak}
    - {name: agentgateway, namespace: infra-agentgateway}
    - {name: traefik, namespace: kube-system}
    - {name: cert-manager-issuers, namespace: infra-cert-manager}
    - {name: cert-manager-open-webui-approval-policy, namespace: infra-cert-manager}
    - {name: rook-ceph, namespace: infra-rook-ceph}
  chart:
    spec:
      chart: ./charts/open-webui/app
      sourceRef: {kind: GitRepository, name: open-webui-addon, namespace: flux-system}
      interval: 10m
  valuesFrom:
    - {kind: ConfigMap, name: frontend-open-webui-app-defaults}
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: open-webui-product-values}

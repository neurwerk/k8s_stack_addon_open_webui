apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-operations-open-webui-ingress
  namespace: infra-postgres-operations
  labels:
    app.kubernetes.io/part-of: frontend-open-webui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-operations
      app.kubernetes.io/instance: postgres-operations
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: frontend-open-webui}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend-open-webui
              app.kubernetes.io/instance: frontend-open-webui
      # PostgreSQL Service 5432 targets the provider pod port 9712.
      ports: [{port: 9712, protocol: TCP}]

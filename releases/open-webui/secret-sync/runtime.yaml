apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-open-webui-external-secrets
  namespace: frontend-open-webui
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-open-webui-secret-sync
    app.kubernetes.io/part-of: frontend-open-webui
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: frontend-open-webui-openbao-secret-store
  namespace: frontend-open-webui
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: frontend-open-webui
          serviceAccountRef:
            name: frontend-open-webui-external-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-open-webui-runtime-secret
  namespace: frontend-open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-open-webui-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-open-webui-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        values.yaml: |
          frontendOpenWebuiSecrets:
            postgresqlPassword: {{ .postgresqlPassword | quote }}
            openidClientSecret: {{ .openidClientSecret | quote }}
            webuiSecretKey: {{ .webuiSecretKey | quote }}
            oauthSessionTokenEncryptionKey: {{ .oauthSessionTokenEncryptionKey | quote }}
            oauthClientInfoEncryptionKey: {{ .oauthClientInfoEncryptionKey | quote }}
  data:
    - secretKey: postgresqlPassword
      remoteRef: {key: frontend-open-webui/internal, property: postgresqlPassword}
    - secretKey: openidClientSecret
      remoteRef: {key: frontend-open-webui/internal, property: openidClientSecret}
    - secretKey: webuiSecretKey
      remoteRef: {key: frontend-open-webui/internal, property: webuiSecretKey}
    - secretKey: oauthSessionTokenEncryptionKey
      remoteRef: {key: frontend-open-webui/internal, property: oauthSessionTokenEncryptionKey}
    - secretKey: oauthClientInfoEncryptionKey
      remoteRef: {key: frontend-open-webui/internal, property: oauthClientInfoEncryptionKey}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-open-webui-external-secrets
  namespace: frontend-open-webui
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-open-webui-secret-sync
    app.kubernetes.io/part-of: frontend-open-webui
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: frontend-open-webui-openbao-secret-store
  namespace: frontend-open-webui
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: addon-open-webui-runtime
          serviceAccountRef:
            name: frontend-open-webui-external-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-open-webui-runtime-secret
  namespace: frontend-open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-open-webui-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-open-webui-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef: {key: addons/open-webui/database, property: password}
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef: {key: addons/open-webui/oidc, property: clientSecret}
    - secretKey: WEBUI_SECRET_KEY
      remoteRef: {key: addons/open-webui/runtime, property: webuiSecretKey}
    - secretKey: OAUTH_SESSION_TOKEN_ENCRYPTION_KEY
      remoteRef: {key: addons/open-webui/runtime, property: oauthSessionTokenEncryptionKey}
    - secretKey: OAUTH_CLIENT_INFO_ENCRYPTION_KEY
      remoteRef: {key: addons/open-webui/runtime, property: oauthClientInfoEncryptionKey}

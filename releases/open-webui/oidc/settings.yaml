apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui-oidc-settings
  namespace: auth-keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/open-webui/oidc
      sourceRef: {kind: GitRepository, name: open-webui-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: keycloak-product-values}

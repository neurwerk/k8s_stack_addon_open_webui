apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-open-webui-oidc
  namespace: auth-keycloak
spec:
  releaseName: auth-keycloak-open-webui-oidc
  interval: 5m
  timeout: 15m
  dependsOn:
    - name: open-webui-oidc-settings
    - name: keycloak-open-webui-access
    - name: keycloak-agentgateway-oidc
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  chart:
    spec:
      chart: ./charts/keycloak/addon-oidc
      sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: auth-keycloak-app-defaults}
    - {kind: ConfigMap, name: open-webui-oidc-settings}
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: keycloak-product-values}
    - {kind: ConfigMap, name: open-webui-oidc-approval-values}
  values:
    clientSecret:
      name: open-webui-oidc-secret
      key: clientSecret

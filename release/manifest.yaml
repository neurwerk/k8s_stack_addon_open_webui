apiVersion: addons.neurwerk.com/v1alpha2
kind: AddonRelease
metadata:
  name: open-webui
spec:
  version: 0.2.0
  status: staged
  sourceName: open-webui-addon
  configurationKey: frontendOpenWebui
  inputs:
    - {kind: ConfigMap, namespace: auth-keycloak, name: auth-keycloak-app-defaults, owner: base}
    - {kind: ConfigMap, namespace: auth-keycloak, name: client-values, owner: client}
    - {kind: ConfigMap, namespace: auth-keycloak, name: keycloak-product-values, owner: client}
    - {kind: ConfigMap, namespace: auth-keycloak, name: open-webui-oidc-approval-values, owner: client}
    - {kind: ConfigMap, namespace: frontend-open-webui, name: client-values, owner: client}
    - {kind: ConfigMap, namespace: frontend-open-webui, name: open-webui-product-values, owner: client}
    - {kind: ConfigMap, namespace: frontend-open-webui, name: open-webui-agentgateway-model-values, owner: client}
    - {kind: ConfigMap, namespace: frontend-open-webui, name: client-openrouter-catalog-values, owner: client}
    - {kind: ConfigMap, namespace: infra-cert-manager, name: client-values, owner: client}
  prerequisites:
    base: 0.4.0
    tooling: 0.14.0
    stackSetup: 0.7.0
    baseCharts:
      - charts/postgres/addon
      - charts/keycloak/addon-access
      - charts/keycloak/addon-oidc
    baseChartVersions:
      charts/postgres/addon: 0.1.3
      charts/keycloak/addon-access: 0.1.6
      charts/keycloak/addon-oidc: 0.2.1
  packages:
    - name: namespaces
      path: releases/namespaces/open-webui
    - name: secret-sync
      path: releases/open-webui/secret-sync
      dependsOn: [namespaces]
    - name: database
      path: releases/open-webui/database
      dependsOn: [secret-sync]
    - name: access
      path: releases/open-webui/access
      dependsOn: [secret-sync]
    - name: oidc
      path: releases/open-webui/oidc
      dependsOn: [access, secret-sync]
      helmOutputs:
        - kind: ConfigMap
          namespace: auth-keycloak
          name: open-webui-oidc-settings
          helmRelease: open-webui-oidc-settings
    - name: certificate-approval
      path: releases/open-webui/certificate-approval
      dependsOn: [namespaces]
    - name: app
      path: releases/open-webui/app
      dependsOn: [database, oidc, certificate-approval]
      helmOutputs:
        - kind: ConfigMap
          namespace: frontend-open-webui
          name: frontend-open-webui-config-map
          helmRelease: frontend-open-webui-shared
  retention:
    databases: retain
    volumes: retain
    credentials: retain
  databases:
    - id: openwebui
      service: {namespace: infra-postgres-operations, name: postgres-operations}
      engine: postgresql
      database: openwebui
      role: openwebui
      owner: open-webui
      package: database
      baseChart: charts/postgres/addon
  artifacts:
    - id: tooling
      role: product
      image: ghcr.io/neurwerk/k8s-stack-addon-open-webui-tooling:0.2.0@sha256:27f368160b7e7c3ae772badfcde92b60f7f4bc15845f4e708f6c5e2ca46cb486
    - id: application
      role: native
      image: ghcr.io/open-webui/open-webui:v0.12.3@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def
    - id: database-provisioner
      role: native
      image: ghcr.io/documentdb/documentdb/documentdb-local:pg18-0.116.0@sha256:01bb9408393fb6417cc32735f4566dee4b53bbab6df6b70c42797317da631f12
    - id: access-provisioner
      role: shared
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.14.0@sha256:a1db80f00e8579478382ecc34717af484cf75239008ae8dbe66b01632aa49305
    - id: oidc-provisioner
      role: shared
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.14.0@sha256:a1db80f00e8579478382ecc34717af484cf75239008ae8dbe66b01632aa49305
  consumers:
    - artifact: tooling
      kind: Command
      argv: [open-webui-validate, /work/addon]
    - artifact: application
      package: app
      kind: HelmRelease
      namespace: frontend-open-webui
      name: frontend-open-webui
      container: open-webui
    - artifact: database-provisioner
      package: database
      kind: HelmRelease
      namespace: infra-postgres-operations
      name: open-webui-postgres
      container: provision
    - artifact: access-provisioner
      package: access
      kind: HelmRelease
      namespace: auth-keycloak
      name: keycloak-open-webui-access
      container: reconcile
    - artifact: oidc-provisioner
      package: oidc
      kind: HelmRelease
      namespace: auth-keycloak
      name: keycloak-open-webui-oidc
      container: configure
  identities:
    - id: browser
      mode: browser
      clientId: open-webui
      secret: {record: oidc, field: clientSecret}
      browserSettings:
        namespace: auth-keycloak
        settings: open-webui-oidc-settings
        approval: open-webui-oidc-approval-values
  setup:
    records:
      - id: database
        path: addons/open-webui/database
        fields:
          password:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
      - id: oidc
        path: addons/open-webui/oidc
        fields:
          clientSecret:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
      - id: runtime
        path: addons/open-webui/runtime
        fields:
          webuiSecretKey:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
          oauthSessionTokenEncryptionKey:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
          oauthClientInfoEncryptionKey:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
    readers:
      - role: infra-postgres-operations
        namespace: infra-postgres-operations
        serviceAccount: infra-postgres-operations-external-secrets
        audience: openbao
        records: [database]
      - role: auth-keycloak
        namespace: auth-keycloak
        serviceAccount: auth-keycloak-external-secrets
        audience: openbao
        records: [oidc]
      - role: addon-open-webui-runtime
        namespace: frontend-open-webui
        serviceAccount: frontend-open-webui-external-secrets
        audience: openbao
        records: [database, oidc, runtime]
    deliveries:
      - namespace: infra-postgres-operations
        name: open-webui-postgres-password
        secretStore: infra-postgres-operations-openbao-secret-store
        targetSecret: open-webui-postgres-password
        records: [database]
      - namespace: auth-keycloak
        name: open-webui-oidc-secret
        secretStore: auth-keycloak-openbao-secret-store
        targetSecret: open-webui-oidc-secret
        records: [oidc]
      - namespace: frontend-open-webui
        name: frontend-open-webui-runtime-secret
        secretStore: frontend-open-webui-openbao-secret-store
        targetSecret: frontend-open-webui-secret
        records: [database, oidc, runtime]
    handover: []
    lifecycle:
      delivery:
        - {kind: SecretStore, namespace: infra-postgres-operations, name: infra-postgres-operations-openbao-secret-store}
        - {kind: SecretStore, namespace: auth-keycloak, name: auth-keycloak-openbao-secret-store}
        - {kind: SecretStore, namespace: frontend-open-webui, name: frontend-open-webui-openbao-secret-store}
        - {kind: ExternalSecret, namespace: infra-postgres-operations, name: open-webui-postgres-password}
        - {kind: ExternalSecret, namespace: auth-keycloak, name: open-webui-oidc-secret}
        - {kind: ExternalSecret, namespace: frontend-open-webui, name: frontend-open-webui-runtime-secret}
      provision:
        - {kind: HelmRelease, namespace: infra-postgres-operations, name: open-webui-postgres}
        - {kind: HelmRelease, namespace: auth-keycloak, name: keycloak-open-webui-access}
        - {kind: HelmRelease, namespace: auth-keycloak, name: open-webui-oidc-settings}
        - {kind: HelmRelease, namespace: auth-keycloak, name: keycloak-open-webui-oidc}
        - {kind: HelmRelease, namespace: frontend-open-webui, name: frontend-open-webui-shared}
      restart:
        - {kind: Deployment, namespace: frontend-open-webui, name: frontend-open-webui}
      rotate: []
